name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      BOT_TOKEN: 1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres_password
      DB_NAME: booking_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5432/booking_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations
        run: alembic check

      - name: Roll back migrations
        run: alembic downgrade base

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tg-booking-engine:ci .
